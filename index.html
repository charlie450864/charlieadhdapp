<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dopamine Pop</title>
<style>
  :root {
    --bg: #0d0f18;
    --card: #171b2b;
    --accent: #8b5cf6;
    --accent-glow: #ec4899;
    --text: #f8fafc;
    --text-muted: #94a3b8;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 24px 16px;
    overflow: hidden;
  }

  /* Header & Stats */
  header {
    text-align: center;
    z-index: 2;
  }

  .counter-display {
    font-size: 3.5rem;
    font-weight: 900;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #a78bfa, #f472b6, #fb923c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(167, 139, 250, 0.35));
    transition: transform 0.05s ease;
  }

  .sub-stats {
    display: flex;
    gap: 16px;
    justify-content: center;
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .combo-pill {
    background: rgba(236, 72, 153, 0.15);
    color: #f472b6;
    border: 1px solid rgba(236, 72, 153, 0.3);
    padding: 2px 10px;
    border-radius: 999px;
    font-weight: 600;
  }

  /* Main Click Area */
  .interactive-zone {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    width: 100%;
    max-width: 420px;
  }

  #main-button {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: none;
    outline: none;
    cursor: pointer;
    background: radial-gradient(circle at 35% 35%, #9333ea, #4f46e5);
    box-shadow: 
      0 0 50px rgba(147, 51, 234, 0.5),
      inset 0 -8px 12px rgba(0, 0, 0, 0.3),
      inset 0 8px 16px rgba(255, 255, 255, 0.35);
    position: relative;
    transform: scale(1);
    transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #main-button:active {
    transform: scale(0.92);
  }

  #main-button.frenzy {
    background: radial-gradient(circle at 35% 35%, #f43f5e, #fb923c);
    box-shadow: 0 0 70px rgba(244, 63, 94, 0.8), inset 0 8px 16px rgba(255, 255, 255, 0.6);
    animation: pulse 0.3s infinite alternate;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.05); }
  }

  .inner-icon {
    font-size: 5rem;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
    pointer-events: none;
  }

  /* Particle Canvas */
  #fx-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  /* Upgrade Shop */
  .upgrades {
    width: 100%;
    max-width: 480px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    z-index: 2;
  }

  .upgrade-card {
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .upgrade-card:hover {
    border-color: rgba(167, 139, 250, 0.4);
    transform: translateY(-2px);
  }

  .upgrade-card:active {
    transform: translateY(1px);
  }

  .upgrade-card.disabled {
    opacity: 0.45;
    filter: grayscale(0.8);
    cursor: not-allowed;
  }

  .upgrade-title {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
  }

  .upgrade-cost {
    font-size: 0.95rem;
    font-weight: 800;
    color: #fbbf24;
    margin-top: 4px;
  }

  .upgrade-level {
    font-size: 0.7rem;
    color: #94a3b8;
  }
</style>
</head>
<body>

  <header>
    <div class="counter-display" id="sparks-display">0</div>
    <div class="sub-stats">
      <span>Per Click: <b id="cpc-display">1</b></span>
      <span>Auto: <b id="cps-display">0</b>/s</span>
      <span class="combo-pill" id="combo-display">1.0x</span>
    </div>
  </header>

  <div class="interactive-zone">
    <canvas id="fx-canvas"></canvas>
    <button id="main-button">
      <span class="inner-icon" id="core-icon">💎</span>
    </button>
  </div>

  <div class="upgrades">
    <div class="upgrade-card" id="upg-click" onclick="buyClick()">
      <div class="upgrade-title">Spicy Pop</div>
      <div class="upgrade-cost" id="cost-click">15</div>
      <div class="upgrade-level" id="lvl-click">Lvl 0 (+1/tap)</div>
    </div>
    <div class="upgrade-card" id="upg-drone" onclick="buyDrone()">
      <div class="upgrade-title">Fidget Spinner</div>
      <div class="upgrade-cost" id="cost-drone">50</div>
      <div class="upgrade-level" id="lvl-drone">Lvl 0 (+2/s)</div>
    </div>
    <div class="upgrade-card" id="upg-luck" onclick="buyLuck()">
      <div class="upgrade-title">Lucky Strike</div>
      <div class="upgrade-cost" id="cost-luck">150</div>
      <div class="upgrade-level" id="lvl-luck">Lvl 0 (Crit %)</div>
    </div>
  </div>

<script>
  // Game State
  let sparks = 0;
  let clickPower = 1;
  let passiveIncome = 0;
  let critChance = 0.05;

  let clickCost = 15;
  let droneCost = 50;
  let luckCost = 150;

  let clickLevel = 0;
  let droneLevel = 0;
  let luckLevel = 0;

  let combo = 0;
  let comboMultiplier = 1;
  let lastClickTime = 0;

  // Audio Engine (Web Audio API synth tones)
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
  }

  function playPopTone(freq = 440, type = 'sine', duration = 0.08) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + duration);

    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  // Particle Engine
  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let floatingTexts = [];

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function spawnParticles(x, y, count = 12, isCrit = false) {
    const palette = isCrit 
      ? ['#fbbf24', '#f59e0b', '#f43f5e', '#ffffff']
      : ['#c084fc', '#f472b6', '#60a5fa', '#34d399'];

    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 3 + Math.random() * (isCrit ? 8 : 5);
      particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: Math.random() * (isCrit ? 5 : 3.5) + 1.5,
        color: palette[Math.floor(Math.random() * palette.length)],
        life: 1,
        decay: 0.02 + Math.random() * 0.02
      });
    }
  }

  function spawnFloatingText(text, x, y, isCrit = false) {
    floatingTexts.push({
      text,
      x,
      y,
      opacity: 1,
      scale: isCrit ? 1.4 : 1,
      color: isCrit ? '#fcd34d' : '#f472b6'
    });
  }

  function loopFX() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Render & update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12; // soft gravity
      p.life -= p.decay;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // Render floating numbers
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y -= 1.5;
      ft.opacity -= 0.02;

      if (ft.opacity <= 0) {
        floatingTexts.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.font = `bold ${Math.floor(20 * ft.scale)}px system-ui`;
      ctx.fillStyle = ft.color;
      ctx.globalAlpha = ft.opacity;
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(loopFX);
  }
  requestAnimationFrame(loopFX);

  // Click Mechanics
  const mainBtn = document.getElementById('main-button');
  const coreIcon = document.getElementById('core-icon');

  const icons = ['💎', '⚡', '🪐', '🔮', '✨', '🔥'];

  mainBtn.addEventListener('pointerdown', (e) => {
    initAudio();
    const now = performance.now();

    // Streak / Combo calculation
    if (now - lastClickTime < 600) {
      combo = Math.min(combo + 1, 50);
    } else {
      combo = 1;
    }
    lastClickTime = now;
    comboMultiplier = 1 + Math.floor(combo / 10) * 0.5;

    // Frenzy state visuals
    if (combo > 20) {
      mainBtn.classList.add('frenzy');
    }

    // Critical Hit Roll
    const isCrit = Math.random() < critChance;
    const gained = Math.round(clickPower * comboMultiplier * (isCrit ? 3.5 : 1));
    sparks += gained;

    // Trigger visual + audio feedback
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    spawnParticles(clickX, clickY, isCrit ? 22 : 12, isCrit);
    spawnFloatingText(`+${gained}${isCrit ? ' CRIT!' : ''}`, clickX, clickY - 20, isCrit);

    // Audio pitch scales up with combo
    const pitch = 300 + Math.min(combo * 18, 600) + (isCrit ? 300 : 0);
    playPopTone(pitch, isCrit ? 'triangle' : 'sine', isCrit ? 0.15 : 0.08);

    // Subtly cycle icon on good streaks
    if (combo % 10 === 0 && combo > 0) {
      coreIcon.textContent = icons[(combo / 10) % icons.length];
    }

    updateUI();
  });

  // Passive Combos decay
  setInterval(() => {
    if (performance.now() - lastClickTime > 800 && combo > 0) {
      combo = 0;
      comboMultiplier = 1;
      mainBtn.classList.remove('frenzy');
      updateUI();
    }
  }, 200);

  // Passive Income ticker (10 updates/sec for smooth progress)
  setInterval(() => {
    if (passiveIncome > 0) {
      sparks += passiveIncome / 10;
      updateUI();
    }
  }, 100);

  // Shop Purchases
  function buyClick() {
    if (sparks >= clickCost) {
      sparks -= clickCost;
      clickLevel++;
      clickPower += 1;
      clickCost = Math.round(clickCost * 1.55);
      playPopTone(650, 'square', 0.1);
      updateUI();
    }
  }

  function buyDrone() {
    if (sparks >= droneCost) {
      sparks -= droneCost;
      droneLevel++;
      passiveIncome += 2;
      droneCost = Math.round(droneCost * 1.5);
      playPopTone(520, 'triangle', 0.1);
      updateUI();
    }
  }

  function buyLuck() {
    if (sparks >= luckCost) {
      sparks -= luckCost;
      luckLevel++;
      critChance = Math.min(critChance + 0.03, 0.65);
      luckCost = Math.round(luckCost * 1.8);
      playPopTone(880, 'sine', 0.12);
      updateUI();
    }
  }

  // UI Updates
  function updateUI() {
    document.getElementById('sparks-display').textContent = Math.floor(sparks).toLocaleString();
    document.getElementById('cpc-display').textContent = clickPower;
    document.getElementById('cps-display').textContent = passiveIncome;
    document.getElementById('combo-display').textContent = `${comboMultiplier.toFixed(1)}x Combo`;

    // Upgrades
    document.getElementById('cost-click').textContent = clickCost;
    document.getElementById('lvl-click').textContent = `Lvl ${clickLevel} (+${clickPower}/tap)`;
    document.getElementById('upg-click').classList.toggle('disabled', sparks < clickCost);

    document.getElementById('cost-drone').textContent = droneCost;
    document.getElementById('lvl-drone').textContent = `Lvl ${droneLevel} (+${passiveIncome}/s)`;
    document.getElementById('upg-drone').classList.toggle('disabled', sparks < droneCost);

    document.getElementById('cost-luck').textContent = luckCost;
    document.getElementById('lvl-luck').textContent = `Lvl ${luckLevel} (${Math.round(critChance * 100)}%)`;
    document.getElementById('upg-luck').classList.toggle('disabled', sparks < luckCost);
  }

  updateUI();
</script>
</body>
</html>
